<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Help Arathi catch the foods she likes and dodge the ones she hates in this pixel-art grocery game.">
<title>Arathi's Grocery Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=VT323&display=swap">
<style>
/* Layout: one portrait game screen, a 9:16 supermarket with a shelf-tag HUD on the ceiling band; title and receipt sit on top of it. */
:root {
  color-scheme: dark;
  --night: #0f3540;      /* outside the store */
  --ceiling: #174a58;    /* HUD band */
  --tag: #ffe27a;        /* shelf price tag yellow */
  --tomato: #e8483f;     /* aisle signs, hearts */
  --leaf: #2f9e55;       /* loves */
  --amber: #e79a23;      /* dislikes */
  --paper: #fbf6e9;      /* till receipt */
  --ink: #23303a;
  --display: "Pixelify Sans", "Courier New", monospace;
  --mono: "VT323", "Courier New", monospace;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; }
html { touch-action: none; }
body {
  background: var(--night); color: var(--paper);
  font-family: var(--mono); font-size: 20px; line-height: 1.15;
  box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#game { position: relative; width: 320px; height: 569px; overflow: hidden; background: var(--ceiling); }
canvas#c { display: block; width: 100%; height: 100%; image-rendering: pixelated; }

#hud {
  position: absolute; inset: 0 0 auto; height: 10%;
  display: flex; align-items: center; gap: 10px; padding-inline: 10px;
  pointer-events: none;
}
#scoreTag {
  background: var(--tag); color: var(--ink); padding: 2px 8px 1px;
  font-family: var(--display); font-weight: 700; font-size: 22px;
  font-variant-numeric: tabular-nums; box-shadow: 3px 3px 0 #0a262e;
  min-width: 56px; text-align: center;
}
#hearts { display: flex; gap: 3px; }
#hearts img { width: 22px; height: 22px; image-rendering: pixelated; }
#hearts img.lost { opacity: .22; }
#aisleCount { margin-left: auto; font-size: 20px; color: var(--paper); white-space: nowrap; }
#mute {
  pointer-events: auto; background: none; border: 2px solid var(--paper); color: var(--paper);
  font-family: var(--mono); font-size: 16px; padding: 1px 6px; cursor: pointer; white-space: nowrap; flex: none;
}
#progress { position: absolute; left: 0; right: 0; top: 10%; height: 4px; background: #0a262e; pointer-events: none; }
#progress i { display: block; height: 100%; width: 0; background: var(--tag); }

.overlay {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
  padding: 10px 12px; box-sizing: border-box; overflow-y: auto; touch-action: pan-y;
  background: rgba(15, 53, 64, .96); gap: 8px;
}
.overlay > :first-child { margin-top: auto; }
.overlay > :last-child { margin-bottom: auto; }
h1 {
  font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1; margin: 0;
  text-align: center; color: var(--tag); text-shadow: 3px 3px 0 var(--tomato); text-wrap: balance;
}
.lede { margin: 0; text-align: center; max-width: 28ch; }
#legend { width: 100%; display: flex; flex-direction: column; gap: 6px; }
.row { background: var(--paper); color: var(--ink); padding: 5px 7px 6px; border-left: 6px solid var(--c); }
.row b { font-family: var(--display); font-weight: 700; font-size: 16px; display: block; margin-bottom: 3px; }
.foods { display: flex; flex-wrap: wrap; gap: 3px 9px; }
.foods span { display: inline-flex; align-items: center; gap: 2px; font-size: 18px; font-variant-numeric: tabular-nums; }
.foods img { width: 32px; height: 32px; image-rendering: pixelated; }
button.go {
  font-family: var(--display); font-weight: 700; font-size: 22px; color: #fff; cursor: pointer;
  background: var(--tomato); border: 0; padding: 9px 22px 8px; box-shadow: 4px 4px 0 #0a262e;
}
button.go:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 #0a262e; }
button:focus-visible { outline: 3px solid var(--tag); outline-offset: 2px; }
.keys { margin: 0; font-size: 17px; opacity: .85; text-align: center; }

#receipt {
  width: 100%; max-width: 270px; box-sizing: border-box; background: var(--paper); color: var(--ink);
  padding: 14px 14px 20px; font-size: 19px;
  --z: 8px;
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - var(--z)),
    92% 100%, 84% calc(100% - var(--z)), 76% 100%, 68% calc(100% - var(--z)), 60% 100%,
    52% calc(100% - var(--z)), 44% 100%, 36% calc(100% - var(--z)), 28% 100%, 20% calc(100% - var(--z)),
    12% 100%, 4% calc(100% - var(--z)), 0 100%);
}
#receipt h2 { font-family: var(--display); font-weight: 700; font-size: 24px; margin: 0; text-align: center; }
#rSub { text-align: center; margin: 2px 0 8px; }
#rLines { border-block: 2px dashed var(--ink); padding-block: 6px; }
#rLines div, .tot { display: flex; justify-content: space-between; gap: 10px; font-variant-numeric: tabular-nums; }
.tot { padding-top: 6px; font-size: 23px; }
#rNote { text-align: center; margin: 8px 0 0; }
@media (prefers-reduced-motion: reduce) { button.go:active { transform: none; } }
</style>
</head>
<body>

<div id="game">
  <canvas id="c" width="810" height="1440" role="img" aria-label="Arathi in a grocery store with food falling from above"></canvas>
  <div id="hud">
    <div id="scoreTag" aria-live="off">0</div>
    <div id="hearts" aria-label="Lives"></div>
    <div id="aisleCount" aria-label="Aisle">1/5</div>
    <button id="mute" type="button" aria-pressed="false">Mute</button>
  </div>
  <div id="progress"><i id="bar"></i></div>

  <section class="overlay" id="title">
    <h1>Arathi's Grocery Run</h1>
    <p class="lede">Food is falling off the shelves. Move Arathi so she only catches what she likes.</p>
    <div id="legend"></div>
    <button class="go" id="start" type="button">Start shopping</button>
    <p class="keys">Drag your finger, or use the arrow keys</p>
    <p class="keys">&copy; 2026 Arathi Unnikrishnan</p>
  </section>

  <section class="overlay" id="end" hidden>
    <div id="receipt">
      <h2 id="rHead">Thank you!</h2>
      <p id="rSub"></p>
      <div id="rLines"></div>
      <div class="tot"><span>TOTAL</span><span id="rTotal">0</span></div>
      <div class="tot" style="font-size:18px;padding-top:0"><span>Best trip</span><span id="rBest">0</span></div>
      <p id="rNote"></p>
    </div>
    <button class="go" id="again" type="button">Shop again</button>
  </section>
</div>

    var d = dir > 0 ? 1 : dir < 0 ? -1 : 0;
    if (face === 'yuck') {
      R(11+d,10,3,1,HAIR); R(17+d,10,3,1,HAIR); R(13+d,13,5,1,'#8d3b3b'); R(14+d,12,3,1,'#8d3b3b');
    } else if (face === 'happy') {
      R(11+d,10,1,1,HAIR); R(12+d,9,1,1,HAIR); R(13+d,10,1,1,HAIR); R(17+d,10,1,1,HAIR); R(18+d,9,1,1,HAIR); R(19+d,10,1,1,HAIR);
      R(13+d,12,5,1,'#b4534f'); R(14+d,13,3,1,'#fbf7ef');
    } else {
      R(11+d,9,3,3,HAIR); R(17+d,9,3,3,HAIR); R(12+d,9,1,1,'#fff'); R(18+d,9,1,1,'#fff'); R(14+d,13,3,1,'#c9605a');
    }
    R(15+d,8,1,1,'#a8484f');                 /* bindi */
    R(10,12,1,1,'#eb9c8d'); R(20,12,1,1,'#eb9c8d');
    /* legs: black tights under a knee-length skirt */
    var l = step === 1 ? -1 : 0, r2 = step === 2 ? -1 : 0;
    R(11,40,3,3+l,TIGHT); R(17,40,3,3+r2,TIGHT); R(10,43+l,4,2,SHOE); R(17,43+r2,4,2,SHOE);
    /* floral dress with puffed short sleeves */
    R(10,19,11,8,DRESS); R(9,27,13,3,DRESS); R(8,30,15,4,DRESS); R(7,34,17,3,DRESS); R(6,37,19,3,DRESS);
    R(8,19,3,4,DRESS); R(20,19,3,4,DRESS); R(7,20,1,2,DRESS); R(23,20,1,2,DRESS);
    [[12,20],[17,20],[14,22],[19,23],[11,23],[9,20],[21,20],[9,33],[13,32],[17,32],[21,33],[11,35],[15,35],[19,35],[8,37],[13,38],[17,38],[22,37],[10,38],[20,39]].forEach(function (p) {
      R(p[0],p[1],1,1,FLOWER); if ((p[0]+p[1]) % 2) { R(p[0]+1,p[1],1,1,FLOWER); }
    });
    /* hair falling over the shoulder */
    R(7,17,3,8,HAIR); R(21,17,2,5,HAIR); R(8,18,1,6,HAIR2);
    /* arms */
    R(8,23,2,3,SKIN); R(21,24,2,2,SKIN); R(20,22,3,2,LINK);   /* scrunchie on her arm */
    /* basket, held high so the dress shows below it */
    R(7,25,17,1,BASK2); R(8,26,15,5,BASK); R(9,31,13,1,BASK2);
    for (var i = 10; i < 22; i += 3) R(i,26,1,5,BASK2);
    R(8,28,15,1,BASK2);
    return c;
  }
  var girl = {};
  ['calm','happy','yuck'].forEach(function (f) {
    [-1,0,1].forEach(function (d) { [0,1,2].forEach(function (s) { girl[f+d+s] = makeGirl(s, f, d); }); });
  });

  /* ---------- Sound ---------- */
  var audio = null, muted = false;
  function initAudio() {
    if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; } }
    if (audio && audio.state === 'suspended') audio.resume();
  }
  function tone(f, t0, len, type, vol) {
    if (!audio || muted) return;
    var o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + t0;
    o.type = type || 'square'; o.frequency.value = f;
    g.gain.setValueAtTime(vol || .05, t); g.gain.exponentialRampToValueAtTime(.001, t + len);
    o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + len);
  }
  function sfx(kind) {
    if (kind === 'love') { tone(660,0,.08); tone(990,.07,.12); }
    else if (kind === 'fine') { tone(520,0,.1); }
    else if (kind === 'dislike') { tone(240,0,.16,'triangle',.09); }
    else if (kind === 'hate') { tone(170,0,.14,'sawtooth'); tone(110,.11,.22,'sawtooth'); }
    else if (kind === 'done') { [523,659,784,1047].forEach(function (f,i) { tone(f,i*.11,.16); }); }
    else if (kind === 'over') { [392,330,262].forEach(function (f,i) { tone(f,i*.16,.2,'triangle',.08); }); }
  }

  /* ---------- State ---------- */
  var mode = 'title', score = 0, hearts = 3, clock = 0, aisle = 0, prevAisle = 0, slide = 1;
  var items = [], floats = [], tally = {}, rim = [], spawnIn = 0, flash = 0, shake = 0;
  var quip = null, keys = { l:false, r:false }, target = null;
  var p = { x: W / 2, dir: 0, walk: 0, moving: false, face: 'calm', faceT: 0 };

  function best(v) {
    try {
      if (v !== undefined) localStorage.setItem('grocery-run-best', String(v));
      return parseInt(localStorage.getItem('grocery-run-best'), 10) || 0;
    } catch (e) { return v || 0; }
  }

  function renderHearts() {
    var box = $('hearts'); box.textContent = '';
    box.setAttribute('aria-label', hearts + ' lives left');
    for (var i = 0; i < 3; i++) {
      var im = new Image(); im.src = heartURL; im.alt = '';
      if (i >= hearts) im.className = 'lost';
      box.appendChild(im);
    }
  }
  var heartURL = sprite.heart.toDataURL();

  function renderHud() {
    $('scoreTag').textContent = score;
    $('aisleCount').textContent = (aisle + 1) + '/' + TRIP;
    $('bar').style.width = Math.min(100, clock / (TRIP * AISLE_SECONDS) * 100) + '%';
  }

  function begin() {
    initAudio();
    score = 0; hearts = 3; clock = 0; aisle = prevAisle = 0; slide = 1;
    items = []; floats = []; tally = {}; rim = []; spawnIn = .3; quip = null; flash = shake = 0;
    p.x = W / 2; p.face = 'calm'; target = null;
    $('title').hidden = true; $('end').hidden = true;
    mode = 'play'; renderHearts(); renderHud();
  }

  function pick() {
    var d = clock / (TRIP * AISLE_SECONDS);
    if (Math.random() < .38 + .2 * d) return BAD[Math.floor(Math.random() * BAD.length)];
    var pool = GOOD.concat(AISLES[aisle].boost, AISLES[aisle].boost, ['strawberry','grapes']);
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function spawn() {
    var d = clock / (TRIP * AISLE_SECONDS);
    items.push({ id: pick(), x: 9 + Math.random() * (W - 18), y: 22, v: (58 + 62 * d) * (.9 + Math.random() * .25), wob: Math.random() * 6 });
    spawnIn = (.72 - .34 * d) * (.8 + Math.random() * .4);
  }

  function caught(it) {
    var f = FOOD[it.id];
    score += f.pts;
    tally[it.id] = (tally[it.id] || 0) + 1;
    floats.push({ text: (f.pts > 0 ? '+' : '') + f.pts, x: p.x, y: FLOOR - 20, t: 0, good: f.pts > 0 });
    quip = { text: f.quip, t: 1.2, good: f.pts > 0 };
    p.face = f.pts > 0 ? 'happy' : 'yuck'; p.faceT = .8;
    if (f.pts > 0) { rim.push(f.hue); if (rim.length > 6) rim.shift(); }
    sfx(f.tone);
    if (f.tone === 'hate') {
      hearts--; flash = .25; shake = reduced ? 0 : .25; renderHearts();
      if (hearts <= 0) finish(false);
    }
    renderHud();
  }

  function finish(completed) {
    mode = 'end'; items = [];
    sfx(completed ? 'done' : 'over');
    var old = best(), top = Math.max(old, score); best(top);
    $('rHead').textContent = completed ? 'Thank you!' : 'Trip over!';
    $('rSub').textContent = completed ? 'Five aisles done. Here is her basket.' : 'Three foods she hates. She left the store.';
    var box = $('rLines'); box.textContent = '';
    var ids = Object.keys(FOOD).filter(function (k) { return tally[k]; });
    ids.forEach(function (k) {
      var row = document.createElement('div'), a = document.createElement('span'), b = document.createElement('span');
      a.textContent = FOOD[k].name + ' x' + tally[k];
      var sum = FOOD[k].pts * tally[k]; b.textContent = (sum > 0 ? '+' : '') + sum;
      row.appendChild(a); row.appendChild(b); box.appendChild(row);
    });
    if (!ids.length) box.textContent = 'Empty basket';
    $('rTotal').textContent = score;
    $('rBest').textContent = top;
    var greens = tally.spinach || 0, note;
    if (score > old && old > 0) note = 'New best trip!';
    else if (!completed) note = 'Try dodging the bananas next time.';
    else if (score >= 900) note = 'A perfect basket.';
    else if (greens >= 5) note = 'Plenty of spinach. Good trip.';
    else if (score >= 500) note = 'A very healthy basket.';
    else note = 'Good start. Catch more spinach.';
    $('rNote').textContent = note;
    $('end').hidden = false;
    $('end').scrollTop = 0;
    $('again').focus({ preventScroll: true });
  }

  /* ---------- Update ---------- */
  function update(dt) {
    if (slide < 1) slide = Math.min(1, slide + dt / .7);
    flash = Math.max(0, flash - dt); shake = Math.max(0, shake - dt);
    if (quip) { quip.t -= dt; if (quip.t <= 0) quip = null; }
    if (p.faceT > 0) { p.faceT -= dt; if (p.faceT <= 0) p.face = 'calm'; }
    floats.forEach(function (f) { f.t += dt; f.y -= 22 * dt; });
    floats = floats.filter(function (f) { return f.t < .9; });
    if (mode !== 'play') { p.moving = false; return; }

    clock += dt;
    var next = Math.min(TRIP - 1, Math.floor(clock / AISLE_SECONDS));
    if (next !== aisle) { prevAisle = aisle; aisle = next; slide = reduced ? 1 : 0; }
    if (clock >= TRIP * AISLE_SECONDS) { renderHud(); finish(true); return; }

    var speed = 165, before = p.x;
    if (keys.l || keys.r) {
      target = null;
      p.x += ((keys.r ? 1 : 0) - (keys.l ? 1 : 0)) * speed * dt;
    } else if (target !== null) {
      var gap = target - p.x, stepMax = 230 * dt;
      p.x += Math.abs(gap) < stepMax ? gap : (gap > 0 ? stepMax : -stepMax);
    }
    p.x = Math.max(13, Math.min(W - 13, p.x));
    var moved = p.x - before;
    p.moving = Math.abs(moved) > .05;
    if (p.moving) { p.walk += dt * 9; p.dir = moved > 0 ? 1 : -1; } else { p.dir = 0; }

    spawnIn -= dt; if (spawnIn <= 0) spawn();

    for (var i = items.length - 1; i >= 0; i--) {
      var it = items[i];
      it.y += it.v * dt;
      var bodyTop = FLOOR + 24 - 45;
      if (it.y + 7 > bodyTop && it.y - 7 < FLOOR + 24 && Math.abs(it.x - p.x) < 15) {
        items.splice(i, 1); caught(it);
        if (mode !== 'play') return;
      } else if (it.y > H + 10) { items.splice(i, 1); }
    }
    renderHud();
  }

  /* ---------- Draw ---------- */
  function bgAt(idx, shift) {
    var offset = Math.round((p.x - 13) / (W - 26) * (BG_W - W));
    ctx.drawImage(bgs[idx], offset, 0, W, H, shift, 0, W, H);
  }
  function text(str, x, y, size, col, align, outline) {
    ctx.font = size + 'px VT323, "Courier New", monospace';
    ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
    if (outline) { ctx.lineWidth = 1.4; ctx.lineJoin = 'round'; ctx.strokeStyle = outline; ctx.strokeText(str, x, y); }
    ctx.fillStyle = col; ctx.fillText(str, x, y);
  }

  function draw() {
    ctx.setTransform(PX, 0, 0, PX, 0, 0);
    ctx.imageSmoothingEnabled = false;
    if (shake > 0) ctx.translate(Math.round(Math.sin(shake * 60) * 2), 0);

    if (slide < 1) {
      var e = Math.round(slide * W);
      bgAt(prevAisle, -e); bgAt(aisle, W - e);
    } else { bgAt(aisle, 0); }

    /* hanging aisle sign */
    var sign = 'AISLE ' + (aisle + 1) + '  ' + AISLES[aisle].label;
    ctx.fillStyle = '#5e7780'; ctx.fillRect(24, 26, 1, 8); ctx.fillRect(W - 25, 26, 1, 8);
    ctx.fillStyle = '#e8483f'; ctx.fillRect(6, 33, W - 12, 13);
    ctx.fillStyle = '#a52d29'; ctx.fillRect(6, 45, W - 12, 1);
    ctx.font = '10px VT323, "Courier New", monospace';
    var signSize = Math.min(10, 10 * (W - 18) / ctx.measureText(sign).width);
    text(sign, W / 2, 39.5, signSize, '#fff6e0');

    /* shadow, basket contents, Arathi */
    var px = Math.round(p.x), py = FLOOR + 24;
    ctx.fillStyle = 'rgba(40,60,70,.28)'; ctx.fillRect(px - 11, py - 1, 22, 3);
    var step = p.moving ? (Math.floor(p.walk) % 2) + 1 : 0;
    var bob = step ? (step === 1 ? -1 : 0) : 0;
    ctx.drawImage(girl[p.face + p.dir + step], px - 15, py - 45 + bob);
    rim.forEach(function (hue, i) {
      ctx.fillStyle = '#2a2230'; ctx.fillRect(px - 7 + i * 2.5 | 0, py - 20 + bob, 3, 3);
      ctx.fillStyle = hue; ctx.fillRect((px - 7 + i * 2.5 | 0), py - 21 + bob, 2, 2);
    });

    /* falling food with a pale halo so it stands out against the shelves */
    items.forEach(function (it) {
      var x = Math.round(it.x + Math.sin(it.y / 14 + it.wob) * 1.5) - 8, y = Math.round(it.y) - 8;
      ctx.globalAlpha = .55; ctx.fillStyle = '#ffffff';
      ctx.fillRect(x + 1, y - 1, 14, 18); ctx.fillRect(x - 1, y + 1, 18, 14);
      ctx.globalAlpha = 1;
      ctx.drawImage(sprite[it.id], x, y);
    });

    floats.forEach(function (f) {
      ctx.globalAlpha = Math.max(0, 1 - f.t / .9);
      text(f.text, f.x, f.y - 26, 13, f.good ? '#ffe27a' : '#ff9d9d', 'center', '#2a2230');
      ctx.globalAlpha = 1;
    });

    if (quip) {
      ctx.font = '9px VT323, "Courier New", monospace';
      var tw = Math.ceil(ctx.measureText(quip.text).width) + 8;
      var bx = Math.max(2, Math.min(W - tw - 2, px - tw / 2 | 0)), by = py - 62;
      ctx.fillStyle = '#2a2230'; ctx.fillRect(bx - 1, by - 1, tw + 2, 13);
      ctx.fillStyle = quip.good ? '#fbf6e9' : '#ffd9d3'; ctx.fillRect(bx, by, tw, 11);
      ctx.fillStyle = '#2a2230'; ctx.fillRect(px - 1, by + 12, 3, 2);
      text(quip.text, bx + tw / 2, by + 5.5, 9, '#2a2230');
    }

    if (flash > 0) { ctx.fillStyle = 'rgba(232,72,63,' + (flash * 1.1) + ')'; ctx.fillRect(0, 0, W, H); }
  }

  var last = performance.now();
  function frame(now) {
    var dt = Math.min(.05, (now - last) / 1000); last = now;
    update(dt); draw();
    requestAnimationFrame(frame);
  }

  /* ---------- Input ---------- */
  function aim(e) {
    if (mode !== 'play') return;
    var r = canvas.getBoundingClientRect();
    target = (e.clientX - r.left) / r.width * W;
  }
  addEventListener('pointerdown', aim);
  addEventListener('pointermove', function (e) { if (e.pointerType === 'mouse' || e.buttons || e.pressure > 0) aim(e); });
  addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { keys.l = true; e.preventDefault(); }
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { keys.r = true; e.preventDefault(); }
  });
  addEventListener('keyup', function (e) {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.l = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.r = false;
  });
  $('start').addEventListener('click', begin);
  $('again').addEventListener('click', begin);
  $('mute').addEventListener('click', function () {
    muted = !muted; this.textContent = muted ? 'Unmute' : 'Mute';
    this.setAttribute('aria-pressed', String(muted)); initAudio();
  });

  /* ---------- Fit the 9:16 screen ---------- */
  function fit() {
    var style = getComputedStyle(document.body);
    var aw = document.body.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
    var ah = document.body.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
    var w = Math.min(aw, ah * 9 / 16), h = w * 16 / 9;
    var box = $('game'); box.style.width = Math.floor(w) + 'px'; box.style.height = Math.floor(h) + 'px';
    var k = w / 360;                               /* HUD text follows the screen size */
    box.style.fontSize = Math.max(.72, Math.min(1.25, k)) + 'em';
  }
  addEventListener('resize', fit); fit();

  /* ---------- Title legend ---------- */
  var groups = [
    ['Loves', 'var(--leaf)', ['spinach','strawberry','grapes','milk','protein','oats']],
    ['Fine', '#4aa3e0', ['apple']],
    ['Too sugary or disliked', 'var(--amber)', ['watermelon','cucumber']],
    ['Hates: lose a heart', 'var(--tomato)', ['banana','brinjal','pumpkin','gourd']]
  ];
  groups.forEach(function (gr) {
    var row = document.createElement('div'); row.className = 'row'; row.style.setProperty('--c', gr[1]);
    var head = document.createElement('b'); head.textContent = gr[0]; row.appendChild(head);
    var wrap = document.createElement('div'); wrap.className = 'foods';
    gr[2].forEach(function (id) {
      var s = document.createElement('span'), im = new Image(), pts = FOOD[id].pts;
      im.src = sprite[id].toDataURL(); im.alt = FOOD[id].name; im.title = FOOD[id].name;
      s.appendChild(im); s.appendChild(document.createTextNode((pts > 0 ? '+' : '') + pts));
      wrap.appendChild(s);
    });
    row.appendChild(wrap); $('legend').appendChild(row);
  });

  renderHearts(); renderHud(); draw();
  if (document.fonts && document.fonts.load) document.fonts.load('10px VT323').then(draw, function () {});
  requestAnimationFrame(frame);
})();
</script>
